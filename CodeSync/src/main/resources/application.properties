server.port=${PORT:8080}
spring.application.name=CodeSync

# WebSocket
codesync.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:*}

# PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/codesync}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME:codesync}
spring.datasource.password=${DATABASE_PASSWORD:codesync_password}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# H2 disabled - application uses PostgreSQL
spring.h2.console.enabled=false

# Piston
codesync.piston.base-url=${PISTON_BASE_URL:http://localhost:2000/api/v2}