server.port=8080
spring.application.name=CodeSync

# Comma-separated list for production, e.g. http://localhost:3000,https://codesync.example.com
codesync.websocket.allowed-origins=*

# H2 file-based database — persists to ./data/codesyncdb.mv.db between restarts.
# No external DB server needed. Swap to Postgres later by changing these 4 lines.
spring.datasource.url=jdbc:h2:file:./data/codesyncdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# Optional: browse the DB at http://localhost:8080/h2-console (JDBC URL above, user sa, blank password)
spring.h2.console.enabled=true

# Piston (code execution) instance. The public emkc.org API became whitelist-only
# in Feb 2026, so this defaults to a self-hosted instance — see README for the
# one-line Docker command to run one locally.
codesync.piston.base-url=http://localhost:2000/api/v2

