services:
  piston:
    image: ghcr.io/engineer-man/piston
    container_name: piston_api
    restart: unless-stopped
    privileged: true
    ports:
      - "2000:2000"
    volumes:
      - piston-packages:/piston/packages
      - /var/run/docker.sock:/var/run/docker.sock
    tmpfs:
      - /piston/jobs:exec

volumes:
  piston-packages:
