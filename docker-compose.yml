services:
  piston:
    image: ghcr.io/engineer-man/piston
    container_name: piston_api
    restart: unless-stopped
    privileged: true
    ports:
      - "2000:2000"
    volumes:
      - piston-packages:/piston/packages
      - /var/run/docker.sock:/var/run/docker.sock
    tmpfs:
      - /piston/jobs:exec

  postgres:
    image: postgres:16
    container_name: codesync_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: codesync
      POSTGRES_USER: codesync
      POSTGRES_PASSWORD: codesync_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  piston-packages:
  postgres-data: